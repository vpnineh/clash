name: Auto Update VPNine1 Subscriptions

on:
  schedule:
    - cron: '3 * * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml geoip2

    - name: Download Offline GeoLite2 Databases
      run: |
        # دانلود مستقیم دیتابیس‌های آفلاین کشور و دیتاسنتر
        curl -L "https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-City.mmdb" -o GeoLite2-City.mmdb
        curl -L "https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-ASN.mmdb" -o GeoLite2-ASN.mmdb

    - name: Create output directory
      run: mkdir -p sub

    - name: Run Dedup & Geo Script
      run: python main.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add sub/sub
        git commit -m "Update sub: High-speed Geo Processing" || echo "هیچ تغییری برای کامیت وجود ندارد"
        git push
